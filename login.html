<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberControl - Acceso al Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#111827] text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#1f2937] p-6 md:p-8 rounded-2xl border border-slate-700/50 shadow-2xl space-y-6">
        
        <div class="text-center">
            <div class="inline-block bg-amber-500 text-slate-950 font-black p-2.5 rounded-xl tracking-tighter mb-3">
                Barbería CB
            </div>
            <h2 class="text-2xl font-extrabold text-amber-500 tracking-wide">Acceso al Panel</h2>
            <p class="text-xs text-slate-400 mt-1">Ingresa tus credenciales para gestionar el sistema.</p>
        </div>

        <!-- Formulario apuntando a backend/login.php -->
        <form id="form-login" action="backend/login.php" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Correo Electrónico</label>
                <input type="email" name="email" required placeholder="tu@correo.com"
                    class="w-full bg-[#111827] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••"
                    class="w-full bg-[#111827] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition">
            </div>
            
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl text-xs uppercase tracking-wider transition mt-2">
                Ingresar al Panel
            </button>
        </form>

        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/40 text-center">
            <p class="text-xs text-slate-400">
                ¿Olvidaste tu contraseña? <br>
                <span class="text-amber-400 font-medium">Contacta al Administrador</span> para que la restablezca.
            </p>
        </div>

        <div class="text-center pt-2 border-t border-slate-700/30">
            <a href="index.html" class="text-xs text-slate-500 hover:text-amber-500 transition duration-200">
                ← Volver a la Barbería (Clientes)
            </a>
        </div>

    </div>

    <script>
        // Mensajes dinámicos devueltos por PHP
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'credenciales_incorrectas') alert('❌ Correo o contraseña incorrectos.');
        if (params.get('error') === 'campos_vacios') alert('⚠️ Por favor completa todos los campos.');
        if (params.get('status') === 'password_cambiada') alert('✅ Tu contraseña fue actualizada exitosamente.');
    </script>
</body>
</html>
